[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-mcp"
version = "0.1.0"
description = "Minimal MCP server exposing simple beam mechanics solvers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "physics-mcp team" }]
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.9.0,<2",
  "httpx>=0.27,<1",
  "langchain>=0.3,<0.4",
  "langchain-openai>=0.2,<0.4",
  "langchain-mcp-adapters>=0.2.0,<0.3",
  "python-dotenv>=1.0,<2",
  "prompt-toolkit>=3.0,<4",

]

[project.optional-dependencies]
anthropic = [
  "langchain-anthropic>=0.3,<0.4",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
]

[project.scripts]
physics-mcp-server = "mcp_server.app:run"
physics-smart-mcp-server = "smart_mcp_server.app:run"
physics-mcp-client = "client.langchain_chat:main"

[tool.setuptools]
packages = ["physics_core", "mcp_server", "smart_mcp_server", "client"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
